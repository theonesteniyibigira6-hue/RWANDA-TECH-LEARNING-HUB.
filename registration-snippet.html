<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('RTLH Service Worker registered with scope:', registration.scope);
                })
                .catch((error) => {
                    console.error('RTLH Service Worker registration failed:', error);
                });
        });
    }
</script>
