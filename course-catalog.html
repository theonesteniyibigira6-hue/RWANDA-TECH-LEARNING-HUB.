<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2a6b">
<title>Course Catalog | Rwanda Tech Learning Hub</title>
<meta name="description" content="Browse every Rwanda Tech Learning Hub course by level, area and access type.">
<link rel="icon" href="rtlh-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a6b;--blue:#1565c0;--sky:#00a1de;--green:#0b7a3b;--yel:#fad201;--ink:#10223f;--mut:#5b6b85;--bg:#f3f7fc;--line:#dfe8f3}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit;text-decoration:none}
.w{width:min(1200px,92%);margin:auto}
header{background:var(--navy);color:#fff}
header .w{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:14px 0}
header .brand{font-weight:800;margin-right:auto}
header .brand{display:flex;align-items:center;gap:10px}
header .brand img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
header .brand small{display:block;font-weight:500;font-size:.68rem;opacity:.8;line-height:1.2}
#lang{padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:#fff;color:var(--ink);font-weight:600;max-width:150px}
#lang:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
/* hide Google's own toolbar and widget so only our selector shows */
.goog-te-banner-frame,.goog-te-balloon-frame,#goog-gt-tt,.goog-tooltip,.goog-te-gadget,.skiptranslate>iframe{display:none!important}
#gt{position:absolute;left:-9999px;height:0;overflow:hidden}
body{top:0!important}
header nav a{font-weight:600;font-size:.9rem;opacity:.85;margin-right:16px}
header nav a:hover,header nav a.cur{opacity:1;border-bottom:2px solid var(--yel)}
h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:28px 0 4px}
.sub{color:var(--mut);margin:0 0 20px;max-width:60ch}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.bar input,.bar select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.bar :focus-visible,.card:focus-visible,.btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#count{font-weight:600;color:var(--mut);margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:48px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(11,42,107,.12)}
.top{height:92px;display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:1.02rem;line-height:1.3}
.body p{margin:0;color:var(--mut);font-size:.86rem;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.tag.Free{background:#e5f5ec;color:var(--green);border-color:#bfe3cd}
.tag.Paid{background:#fff6cc;color:#7a6200;border-color:#f0dd7a}
.tag.Scholarship{background:#e6f1ff;color:var(--blue);border-color:#bcd7f7}
.meta{font-size:.8rem;color:var(--mut)}
.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center}
.btn{display:inline-block;margin-top:10px;background:var(--blue);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;border:0;cursor:pointer}
footer{background:var(--navy);color:#cfe0ff;padding:22px 0;font-size:.85rem}
@media(max-width:760px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header><div class="w">
  <a class="brand notranslate" translate="no" href="learning-center.html">
    <img src="rtlh-logo.png" alt="RTLH logo" width="42" height="42" onerror="this.style.display='none'">
    <span>Rwanda Tech Learning Hub<small>Learn · Create · Empower</small></span>
  </a>
  <nav>
    <a href="learning-center.html">Learning Center</a>
    <a class="cur" href="course-catalog.html">Course catalog</a>
    <a href="self-paced.html">Self-paced</a>
    <a href="eclass-center.html">E-Class</a>
    <a href="learning-dashboard.html">My learning</a>
  </nav>
  <select id="lang" class="notranslate" translate="no" aria-label="Language"></select>
</div></header>

<main class="w">
  <h1>Course catalog</h1>
  <p class="sub">Pick a level, an area or an access type, or search by keyword. Select a course to see its lessons and enroll.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search courses" aria-label="Search courses">
    <select id="level" aria-label="Level"></select>
    <select id="area" aria-label="Area"></select>
    <select id="access" aria-label="Access">
      <option value="">Any access</option><option>Free</option><option>Paid</option><option>Scholarship</option>
    </select>
  </div>
  <div id="count" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>

<div id="gt"></div>
<footer><div class="w">Rwanda Tech Learning Hub. Learn, create, empower.</div></footer>

<script src="courses-data.js"></script>
<script>
const $=s=>document.querySelector(s);
const LEVELS={nursery:"Nursery",primary:"Primary",olevel:"Secondary (O-Level)",alevel:"Secondary (A-Level)",ttc:"TTC",tvet:"TVET",professional:"Professional",adult:"Community and adult",bachelor:"Bachelor",masters:"Master's",phd:"PhD"};
const AREAS={academic:"Academic",technology:"Technology",trade:"TVET and trades",life:"Social and life",health:"Health",business:"Business",science:"Science",teacher:"Teaching",arts:"Arts"};
const fill=(el,all,obj)=>{el.innerHTML='<option value="">'+all+'</option>'+Object.entries(obj).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join("")};
fill($("#level"),"All levels",LEVELS);fill($("#area"),"All areas",AREAS);

/* Filters can arrive from learning-center.html, e.g. course-catalog.html?field=health */
const P=new URLSearchParams(location.search);
$("#level").value=P.get("level")||"";
$("#area").value=P.get("field")||P.get("area")||"";
$("#access").value=P.get("access")||"";
$("#q").value=P.get("q")||"";

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const q=$("#q").value.trim().toLowerCase(),lv=$("#level").value,ar=$("#area").value,ac=$("#access").value;
  const list=ALL().filter(c=>(!lv||c[2]===lv)&&(!ar||c[3]===ar)&&(!ac||c[5]===ac)&&(!q||(c[1]+" "+c[10]).toLowerCase().includes(q)));
  $("#count").textContent=list.length+(list.length===1?" course":" courses");
  $("#grid").innerHTML=list.length?list.map(c=>{
    const g=COL[c[3]]||COL.academic;
    return '<a class="card" href="course-details.html?id='+encodeURIComponent(c[0])+'">'+
      '<div class="top" style="background:linear-gradient(120deg,'+g+')">'+esc(c[9])+'</div>'+
      '<div class="body"><h3>'+esc(c[1])+'</h3><p>'+esc(c[10])+'</p>'+
      '<div class="tags"><span class="tag '+esc(c[5])+'">'+esc(c[5])+'</span><span class="tag">'+esc(c[4])+'</span><span class="tag">'+esc(c[6])+'</span></div>'+
      '<div class="meta">'+esc(c[7])+' lessons, '+esc(c[8])+' weeks</div></div></a>';
  }).join(""):'<div class="empty"><strong>No courses match these filters.</strong><br>Clear a filter or try a different keyword.<br><button class="btn" id="reset">Clear filters</button></div>';
  const r=$("#reset");if(r)r.onclick=()=>{["#q","#level","#area","#access"].forEach(s=>$(s).value="");render()};
}
["#q","#level","#area","#access"].forEach(s=>$(s).addEventListener("input",render));
render();

/* ---------- Language: 13 options, Kinyarwanda included ---------- */
const LANGS=[["en","English"],["rw","Kinyarwanda"],["fr","Français"],["sw","Kiswahili"],["es","Español"],["ar","العربية"],["zh-CN","中文"],["hi","हिन्दी"],["pt","Português"],["de","Deutsch"],["ru","Русский"],["ja","日本語"],["am","አማርኛ"]];
const CODES=LANGS.map(l=>l[0]);
const sel=$("#lang");
sel.innerHTML=LANGS.map(l=>'<option value="'+l[0]+'">'+l[1]+'</option>').join("");

/* Smart default: saved choice first, then the browser language, then English */
function pickLang(){
  let s=null;try{s=localStorage.rtlhLang}catch(e){}
  if(s&&CODES.includes(s))return s;
  for(const n of (navigator.languages||[navigator.language||"en"])){
    const b=n.toLowerCase();
    const hit=CODES.find(c=>c.toLowerCase()===b)||CODES.find(c=>c.toLowerCase()===b.split("-")[0])||(b.startsWith("zh")?"zh-CN":null);
    if(hit)return hit;
  }
  return "en";
}
function cookie(c){
  const v=c==="en"?"":"/en/"+c;
  document.cookie="googtrans="+v+";path=/;max-age="+(v?31536000:0);
  document.cookie="googtrans="+v+";path=/;domain="+location.hostname+";max-age="+(v?31536000:0);
}
function setLang(c,fromUser){
  try{localStorage.rtlhLang=c}catch(e){}
  sel.value=c;
  document.documentElement.lang=c.split("-")[0];
  document.documentElement.dir=c==="ar"?"rtl":"ltr";
  const cb=document.querySelector(".goog-te-combo");
  if(cb){cb.value=c;cb.dispatchEvent(new Event("change"));}
  else{cookie(c);if(fromUser||c!=="en")location.reload();}
}
sel.addEventListener("change",()=>setLang(sel.value,true));

const startLang=pickLang();
sel.value=startLang;
document.documentElement.dir=startLang==="ar"?"rtl":"ltr";
function gtInit(){
  new google.translate.TranslateElement({pageLanguage:"en",includedLanguages:CODES.join(","),autoDisplay:false},"gt");
  if(startLang!=="en")setTimeout(()=>setLang(startLang),600);
}
window.gtInit=gtInit;
if(startLang!=="en")cookie(startLang);
const gs=document.createElement("script");
gs.src="https://translate.google.com/translate_a/element.js?cb=gtInit";
document.body.appendChild(gs);
</script>
</body>
</html>
