<style>

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Montserrat,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.85rem;line-height:1.1;color:#fff;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--sky);object-fit:cover}
.brand small{display:block;font:400 1.05rem "Great Vibes",cursive;color:var(--yel)}

main{width:min(520px,100% - 28px);margin:18px auto 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 40px #0b2a6b14}
h1{margin:0 0 4px;font-size:1.5rem;color:var(--navy);letter-spacing:-.02em}.sub{margin:0 0 14px;color:var(--mut);font-size:.88rem}
label{display:block;font-size:.76rem;font-weight:700;margin:12px 0 5px;color:var(--mut)}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#f9fbfe;font:inherit;font-size:16px;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--sky);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.two{grid-template-columns:1fr}}
.pw{position:relative}.pw input{padding-inline-end:96px}.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:0;border:0;color:var(--blue);font-weight:700;font-size:.75rem;padding:10px;cursor:pointer}

<div class="flag"></div>
<header>

<main>
 <div class="card">
  <h1 data-t="title">Create your account</h1>
  <p class="sub" data-t="sub">Join free. Learn at your own pace.</p>
  <button class="btn o" id="g" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.7-4-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span data-t="google">Continue with Google</span></button>
  <p class="hint" style="text-align:center;margin:8px 0 0" data-t="gnote"></p><div class="or" data-t="or">or register with email</div>

  <form id="f" novalidate autocomplete="on">
   <label for="fn" data-t="name">Full name</label><input id="fn" autocomplete="name" required maxlength="80">
   <label for="em" data-t="email">Email address</label><input id="em" type="email" inputmode="email" autocomplete="email" required>
   <div class="two">
    <div><label for="ph" data-t="phone">Phone (optional)</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX"></div>
    <div><label for="co" data-t="country">Country</label><select id="co" autocomplete="country-name"><option>Rwanda</option></select></div>
   </div>
   <label for="ty" data-t="type">I am a</label>
   <select id="ty"><option value="learner" data-t="o1">Learner (adult / self-paced)</option><option value="student" data-t="o2">School student</option><option value="teacher" data-t="o3">Teacher (apply to teach)</option><option value="other" data-t="o4">Other</option></select>
   <label for="pw" data-t="pass">Password</label>
   <div class="pw"><input id="pw" type="password" autocomplete="new-password" minlength="8" required><button type="button" id="sh" aria-pressed="false" aria-controls="pw pw2"><span id="shi" aria-hidden="true">👁</span><span id="sht">Show</span></button></div>
   <div class="meter"><i id="mt"></i></div><div class="hint" data-t="phint">At least 8 characters, with letters and numbers.</div>
   <label for="pw2" data-t="pass2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required>
   <div class="hp" aria-hidden="true"><label>Leave empty<input id="hp" tabindex="-1" autocomplete="off"></label></div>
   <label class="chk"><input type="checkbox" id="tm"><span><span data-t="agree">I agree to the</span> <a href="terms.html" target="_blank" rel="noopener" data-t="terms">Terms</a> &amp; <a href="privacy.html" target="_blank" rel="noopener" data-t="privacy">Privacy Policy</a>.</span></label>
   <div class="msg" id="msg" role="alert" aria-live="polite"></div>
   <button class="btn" id="go" type="submit" data-t="create">Create account</button>
  </form>
  <p class="foot"><span data-t="have">Already have an account?</span> <a href="account.html" data-t="login">Log in</a></p>
 </div>
</main>

for(const k in X)Object.assign(T[k],X[k]);

/* ---------- smart language system ---------- */
const NATIVE=["en","rw","fr","sw"];
const MORE=[["es","Español"],["pt","Português"],["de","Deutsch"],["ar","العربية"],["zh-CN","中文"],["hi","हिन्दी"],["ru","Русский"],["tr","Türkçe"],["it","Italiano"],["ja","日本語"],["ko","한국어"],["am","አማርኛ"],["so","Soomaali"],["lg","Luganda"],["ha","Hausa"],["yo","Yorùbá"],["zu","isiZulu"]];
let L="en",moreCode="",busy=false;
const saved=(()=>{try{return localStorage.rtlhLang||""}catch(e){return ""}})();
const pref=(navigator.languages||[navigator.language||"en"]).map(l=>l.slice(0,2).toLowerCase()).find(l=>NATIVE.includes(l));
if(NATIVE.includes(saved))L=saved;else if(MORE.some(m=>m[0]===saved))moreCode=saved;else L=pref||"en";
$("#lang2").innerHTML='<option value="">Choose language…</option>'+MORE.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("");
const keep=v=>{try{localStorage.rtlhLang=v}catch(e){}};
function gtSet(code){const c=document.querySelector(".goog-te-combo");if(!c)return setTimeout(()=>gtSet(code),400);c.value=code;c.dispatchEvent(new Event("change"));document.documentElement.dir=code==="ar"?"rtl":"ltr"}
function gtLoad(code){
  if(window.google&&google.translate&&document.querySelector(".goog-te-combo"))return gtSet(code);
  window.gtInit=()=>{new google.translate.TranslateElement({pageLanguage:"en",includedLanguages:MORE.map(m=>m[0]).join(","),autoDisplay:false},"gt");setTimeout(()=>gtSet(code),700)};
  const s=document.createElement("script");s.src="https://translate.google.com/translate_a/element.js?cb=gtInit";s.async=true;document.head.append(s)}
function gtReset(){const c=document.querySelector(".goog-te-combo");if(c){c.value="";c.dispatchEvent(new Event("change"))}document.documentElement.dir="ltr"}
$("#lang").onchange=e=>{const v=e.target.value;
  if(v==="more"){$("#lang2").hidden=false;$("#lang2").focus();return}
  $("#lang2").hidden=true;moreCode="";gtReset();L=v;keep(v);render()};
$("#lang2").onchange=e=>{const v=e.target.value;if(!v)return;moreCode=v;L="en";keep(v);render();gtLoad(v)};

/* ---------- all world countries (names localised by the browser) ---------- */
const CC="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW PS TW XK".split(" ");
function buildCountries(){
  const sel=$("#co"),cur=sel.value||"Rwanda";let dn,en;
  try{en=new Intl.DisplayNames(["en"],{type:"region"});dn=new Intl.DisplayNames([moreCode?"en":L],{type:"region"})}catch(e){en=dn={of:c=>c}}
  const rows=CC.map(c=>[en.of(c),dn.of(c)||en.of(c)]).filter(r=>r[0]&&r[0].length>2);
  rows.sort((a,b)=>a[1].localeCompare(b[1],moreCode?"en":L));
  const i=rows.findIndex(r=>r[0]==="Rwanda"),top=rows.splice(i,1)[0];

function render(){
  const t=T[L];document.documentElement.lang=L;
  $("#lang").value=moreCode?"more":L;$("#lang2").hidden=!moreCode;if(moreCode)$("#lang2").value=moreCode;
  $$("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]||e.textContent);
  const shown=$("#pw").type==="text";$("#shi").textContent=shown?"🙈":"👁";$("#sht").textContent=shown?t.hide:t.show;$("#sh").setAttribute("aria-pressed",shown);
  buildCountries();if(!busy)$("#go").textContent=t.create}

$("#sh").onclick=()=>{const show=$("#pw").type==="password";$("#pw").type=$("#pw2").type=show?"text":"password";render()};

  const [A,Au,Fs]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);

/* Profile shape matches your Firestore rules: role is never admin. */
async function profile(u,x){
  const ref=doc(db,"users",u.uid);if((await getDoc(ref)).exists())return;
  await setDoc(ref,{uid:u.uid,email:u.email,fullName:x.name,displayName:x.name,phone:x.phone||"",country:x.country||"Rwanda",

function done(u,name){try{localStorage.rtlhUser=JSON.stringify({name,email:u.email,uid:u.uid})}catch(e){}say(T[L].ok,true);setTimeout(()=>location.href=NEXT,1500)}
async function finishGoogle(u){const n=u.displayName||u.email.split("@")[0];await profile(u,{name:n,country:$("#co").value,type:$("#ty").value});done(u,n)}

/* ---------- email sign-up ---------- */
$("#f").onsubmit=async e=>{

  if(!await ready){say(t.load);return busyOn(false)}
  try{const r=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(r.user,{displayName:name});
    await profile(r.user,{name,phone:$("#ph").value.trim(),country:$("#co").value,type:$("#ty").value});sendEmailVerification(r.user).catch(()=>{});done(r.user,name)}
  catch(x){const k=ERR[x.code];say(k===""?"":t[k||"eFail"]);busyOn(false)}};

/* ---------- Google (popup, with redirect fallback) ---------- */
$("#g").onclick=async()=>{
  if(busy)return;say("");busyOn(true);
  if(!await ready){say(T[L].load);return busyOn(false)}
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{const r=await signInWithPopup(auth,p);await finishGoogle(r.user)}
  catch(x){
    if(x.code==="auth/popup-blocked"||x.code==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(auth,p);return}catch(y){x=y}}
