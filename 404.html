<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Rwanda Tech Learning Hub</title>
    <style>
        :root {
            --primary-color: #00A3E0;
            --primary-hover: #0082B3;
            --secondary-color: #2D3748;
            --bg-color: #F7FAFC;
            --card-bg: #FFFFFF;
            --text-muted: #718096;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 12px;
        }

        .error-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #EDF2F7;
            color: var(--secondary-color);
        }

        .btn-secondary:hover {
            background-color: #E2E8F0;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #EDF2F7;
            padding-top: 20px;
        }

        @media (max-width: 480px) {
            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-description">
            The page or resource you are looking for doesn't exist, has been removed, or is temporarily unavailable.
        </p>

        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">&larr; Return to Home</a>
            
            <div class="links-grid">
                <a href="course.html" class="btn btn-secondary">Explore Courses</a>
                <a href="elibrary.html" class="btn btn-secondary">E-Library</a>
            </div>
        </div>

        <footer>
            &copy; 2026 Rwanda Tech Learning Hub. All rights reserved.
        </footer>
    </div>

</body>
</html>
